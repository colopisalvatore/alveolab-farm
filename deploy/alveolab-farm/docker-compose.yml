# ALVEOLAB Farm on the homelab (CT 100, 192.168.1.101).
#
# Drop-in replacement for the upstream Bambuddy container: same container
# name, host networking, port, user and — crucially — the SAME named volumes
# the previous install created (`bambuddy_bambuddy_data`, `bambuddy_bambuddy_logs`),
# so printers, archives, library and settings carry over untouched.
#
# The image is built locally from this repository (it is private, so there
# is no registry image):
#
#   cd /opt/alveolab-farm && docker compose -f deploy/alveolab-farm/docker-compose.yml build
#   docker compose -f deploy/alveolab-farm/docker-compose.yml up -d
#
# Rollback: stop this stack and `docker compose up -d` in /opt/bambuddy again
# (see docs/alveolab-farm/IMPLEMENTATION_PLAN.md, "Deploy home lab").
name: alveolab-farm

services:
  alveolab-farm:
    image: alveolab-farm:latest
    build:
      context: ../..
    container_name: bambuddy
    user: "${PUID:-1000}:${PGID:-1000}"
    cap_add:
      - NET_BIND_SERVICE
    network_mode: host
    volumes:
      - bambuddy_data:/app/data
      - bambuddy_logs:/app/logs
      - /opt/bambuddy/virtual_printer:/app/data/virtual_printer
    environment:
      - TZ=${TZ:-Europe/Rome}
      - PORT=${PORT:-8100}
    restart: unless-stopped

volumes:
  bambuddy_data:
    external: true
    name: bambuddy_bambuddy_data
  bambuddy_logs:
    external: true
    name: bambuddy_bambuddy_logs
